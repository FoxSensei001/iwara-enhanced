name: 问题反馈 / Bug report / 不具合の報告
description: 某个功能不正常、报错或者页面错乱 / Something doesn't work, errors, or the page looks broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        中文、English、日本語都可以。请不要贴出账号、Cookie 或其他个人信息。
        Any of Chinese, English or Japanese is fine. Please don't post your account details, cookies or other personal data.
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 在哪个页面、做了什么、看到了什么，期望是什么 / Which page, what you did, what you saw, what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 打开 / Open https://www.iwara.tv/...
        2. 点击 / Click ...
        3. ...
  - type: input
    id: version
    attributes:
      label: 插件版本 / Version
      description: 油猴管理面板或扩展管理页里能看到 / Shown in your script manager or the extensions page
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 装法 / Installed as
      options:
        - 油猴脚本 / Userscript (Tampermonkey / Violentmonkey)
        - Firefox 扩展 / Firefox add-on
        - Chrome / Edge 手动加载 / Chrome / Edge, loaded unpacked
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器和系统 / Browser and OS
      placeholder: "Chrome 131 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 截图或控制台报错 / Screenshots or console errors
      description: 按 F12 打开控制台，带 [iwe] 的报错最有用 / Press F12; errors mentioning the script are the most useful
